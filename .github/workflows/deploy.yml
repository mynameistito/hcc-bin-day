name: Deploy Cloudflare Workers

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || 'other' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare deploy/preview cleanup because CLOUDFLARE_ACCOUNT_ID and/or CLOUDFLARE_API_TOKEN is not configured."
          fi
      - name: Deploy or clean up preview
        if: steps.credentials.outputs.available == 'true'
        uses: mynameistito/alchemy-deploy@0e2820973a0536bdf9c4e33d0b8a7eebe85372f2 # v2.4.0
        with:
          worker-name: hcc-bin-day
          deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-url: https://bin-day.mynameistito.com
          production-branch: main
          ci-workflow: ci.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  reconcile:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare reconciliation because CLOUDFLARE_ACCOUNT_ID and/or CLOUDFLARE_API_TOKEN is not configured."
          fi
      - name: Reconcile closed pull-request previews
        if: steps.credentials.outputs.available == 'true'
        uses: mynameistito/alchemy-deploy@0e2820973a0536bdf9c4e33d0b8a7eebe85372f2 # v2.4.0
        with:
          worker-name: hcc-bin-day
          deploy-command: bunx --no-install alchemy deploy --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy --stage "$STAGE" --yes
          production-url: https://bin-day.mynameistito.com
          production-branch: main
          ci-workflow: ci.yml
          reconcile: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
